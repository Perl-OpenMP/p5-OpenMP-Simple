name: Perl CI with Inline::C and OpenMP

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.44"

      - name: Install build essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgomp1

      - name: Install distribution and author dependencies
        run: |
          cpanm --verbose --notest Dist::Zilla Module::Build Inline::C \
            Alien::OpenMP Util::H2O::More Test::Exception Test::Deep \
            OpenMP::Environment File::ShareDir
          dzil authordeps --missing | xargs -r cpanm --verbose --notest

      - name: Report Perl and OpenMP configuration
        run: |
          perl -V
          perl -MAlien::OpenMP -E 'say "Alien::OpenMP=$Alien::OpenMP::VERSION"; say "cflags=".Alien::OpenMP->cflags; say "libs=".Alien::OpenMP->libs'

      - name: Run `dzil test`
        run: dzil test
